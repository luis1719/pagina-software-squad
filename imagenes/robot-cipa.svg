<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Robot futurista de Cipa Software Squad</title>
  <desc id="descripcion">Robot amigable plateado con visor azul y ojos cian luminosos.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".6" stop-color="#dbe7f5"/><stop offset="1" stop-color="#a8b9d2"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17243d"/><stop offset="1" stop-color="#304e7d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67f5ff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g class="robot-shadow" opacity=".18"><ellipse cx="140" cy="264" rx="78" ry="9" fill="#2563eb"/></g>
  <g class="robot-body">
    <path d="M91 182h98l19 66H72z" fill="url(#metal)" stroke="#8298b6" stroke-width="3"/>
    <path d="M112 193h56v51h-56z" fill="#edf5ff" opacity=".85"/>
    <path d="M126 216h28" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="140" cy="235" r="5" fill="#84cc16" filter="url(#glow)"/>
    <g class="robot-arm robot-arm-left"><path d="M85 188 51 216l-20-31" fill="none" stroke="url(#metal)" stroke-width="19" stroke-linecap="round"/><circle cx="52" cy="215" r="12" fill="#dbe7f5" stroke="#2563eb" stroke-width="3"/><path d="m30 184-10-18m13 14-2-21m8 22 7-18" fill="none" stroke="#8298b6" stroke-width="5" stroke-linecap="round"/></g>
    <g class="robot-arm robot-arm-right"><path d="M195 188 229 216l20-31" fill="none" stroke="url(#metal)" stroke-width="19" stroke-linecap="round"/><circle cx="228" cy="215" r="12" fill="#dbe7f5" stroke="#06b6d4" stroke-width="3"/><path d="m250 184 10-18m-13 14 2-21m-8 22-7-18" fill="none" stroke="#8298b6" stroke-width="5" stroke-linecap="round"/></g>
    <path d="M103 75h74l12 20v64l-18 22h-62l-18-22V95z" fill="url(#metal)" stroke="#8298b6" stroke-width="3"/>
    <rect x="103" y="102" width="74" height="44" rx="15" fill="url(#visor)" stroke="#5e7da9" stroke-width="3"/>
    <g class="robot-eyes" fill="url(#cyan)" filter="url(#glow)"><ellipse cx="126" cy="124" rx="8" ry="6"/><ellipse cx="154" cy="124" rx="8" ry="6"/></g>
    <path d="M127 135q13 10 26 0" fill="none" stroke="#67f5ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 75V52" stroke="#8298b6" stroke-width="6" stroke-linecap="round"/><circle cx="140" cy="45" r="9" fill="#7c3aed" filter="url(#glow)"/>
    <circle cx="93" cy="110" r="7" fill="#06b6d4" filter="url(#glow)"/><circle cx="187" cy="110" r="7" fill="#06b6d4" filter="url(#glow)"/>
  </g>
</svg>