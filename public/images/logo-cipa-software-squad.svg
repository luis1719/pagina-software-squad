<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Logo de Cipa Software Squad</title>
  <desc id="desc">Monograma CS con símbolos de programación y líneas de circuito.</desc>
  <defs>
    <style>
      .letra-cs, .codigo, .circuito, .nodo { transition: transform .24s ease, filter .24s ease, opacity .24s ease; transform-origin: 64px 64px; }
      svg:hover .letra-cs { transform: scale(1.035); filter: drop-shadow(0 0 7px rgba(185, 244, 81, .45)); }
      svg:hover .circuito, svg:hover .nodo { filter: drop-shadow(0 0 7px rgba(89, 215, 255, .55)); opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .letra-cs, .codigo, .circuito, .nodo { transition: none; } }
    </style>
    <linearGradient id="logoGradient" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9f451"/>
      <stop offset=".55" stop-color="#59d7ff"/>
      <stop offset="1" stop-color="#7fffd4"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="10" y1="8" x2="116" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f243c"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#panelGradient)"/>
  <path class="codigo" d="M21 72V56l15-13v14l-8 7 8 7v14L21 72Z" fill="#59d7ff"/>
  <path class="codigo" d="M107 56v16L92 85V71l8-7-8-7V43l15 13Z" fill="#b9f451"/>
  <path class="codigo" d="M78 24h13v13h-9v12h-9V33c0-5 2-9 5-9Z" fill="url(#logoGradient)"/>
  <path class="codigo" d="M50 104H37V91h9V79h9v16c0 5-2 9-5 9Z" fill="url(#logoGradient)"/>
  <path class="letra-cs" d="M72 88c-6 5-14 8-23 8-20 0-35-14-35-32s15-32 35-32c9 0 17 3 23 8l-11 13c-3-3-7-4-12-4-10 0-18 7-18 15s8 15 18 15c5 0 9-1 12-4l11 13Z" fill="url(#logoGradient)"/>
  <path class="letra-cs" d="M66 84c5 6 14 10 25 10 15 0 25-8 25-20 0-13-10-17-23-20-7-2-10-3-10-6 0-3 3-5 8-5 6 0 11 2 16 6l8-13c-6-5-14-8-24-8-15 0-25 8-25 20 0 13 11 17 24 20 7 2 9 3 9 6 0 3-3 5-9 5-7 0-13-3-18-8L66 84Z" fill="#f4f8fb"/>
  <path class="circuito" d="M42 18h18M60 18v13M86 110H68M68 110V97" fill="none" stroke="url(#logoGradient)" stroke-width="6" stroke-linecap="round"/>
  <circle class="nodo" cx="42" cy="18" r="5" fill="#b9f451"/>
  <circle class="nodo" cx="86" cy="110" r="5" fill="#59d7ff"/>
</svg>
